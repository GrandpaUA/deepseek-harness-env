# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# Ukrainian locale dictionaries for the web UI (local plugin, see
# profiles/web/node_modules/@local/dsh-locale-uk).
- insert:
    - id: locale-uk
      name: '@local/dsh-locale-uk'

# Вимикаємо вбудований плагін DeepSeek/DashScope: він реєструє роути
# "DeepSeek" і "DashScope (Qwen)", які не видаляються через GUI. Ми ними
# не користуємось (Qwen йде через llm-pi-ai qwen-token-plan).
# Щоб повернути — прибрати цей запис і рестартнути інстанс.
- id: llm-deepseek
  disabled: true

